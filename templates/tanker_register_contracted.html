<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Existing Purvankara Partner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #163b65;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            color: #163b65;
            margin-bottom: 8px;
        }

        .form-card .description {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #1769aa;
        }

        .section-title {
            color: #1769aa;
            margin: 25px 0 15px;
            font-size: 17px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #12558a;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1769aa;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .form-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Existing Purvankara Partner</h1>
        <p>Register your existing Purvankara tanker contract</p>
    </div>

    <div class="form-card">

        <h2>Partner Registration</h2>

        <p class="description">
            Enter your details and existing contract information.
            Your registration will be verified by the Purvankara team.
        </p>

        <form method="POST" action="/tanker/register/contracted">

            <h3 class="section-title">Operator Details</h3>

            <div class="form-group">
                <label for="operator_name">Full Name</label>
                <input
                    type="text"
                    id="operator_name"
                    name="operator_name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter mobile number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >
            </div>


            <h3 class="section-title">Contract Details</h3>

            <div class="form-group">
                <label for="contract_id">Purvankara Contract ID</label>
                <input
                    type="text"
                    id="contract_id"
                    name="contract_id"
                    placeholder="Enter your contract ID"
                    required
                >
            </div>

            <div class="form-group">
                <label for="contract_start">Contract Start Date</label>
                <input
                    type="date"
                    id="contract_start"
                    name="contract_start"
                    required
                >
            </div>

            <div class="form-group">
                <label for="contract_end">Contract End Date</label>
                <input
                    type="date"
                    id="contract_end"
                    name="contract_end"
                    required
                >
            </div>


            <h3 class="section-title">Tanker Details</h3>

            <div class="form-group">
                <label for="registration_no">Tanker Registration Number</label>
                <input
                    type="text"
                    id="registration_no"
                    name="registration_no"
                    placeholder="Example: KA-01-XX-1234"
                    required
                >
            </div>

            <div class="form-group">
                <label for="capacity">Tanker Capacity</label>
                <select id="capacity" name="capacity" required>
                    <option value="">Select capacity</option>
                    <option value="5">5 KL</option>
                    <option value="6">6 KL</option>
                    <option value="8">8 KL</option>
                    <option value="10">10 KL</option>
                    <option value="12">12 KL</option>
                    <option value="14">14 KL</option>
                    <option value="16">16 KL</option>
                    <option value="20">20 KL</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vehicle_model">Vehicle Model</label>
                <input
                    type="text"
                    id="vehicle_model"
                    name="vehicle_model"
                    placeholder="Enter tanker vehicle model"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                Submit for Verification
            </button>

        </form>

        <a href="/tanker/register" class="back">
            ← Back to Partner Selection
        </a>

    </div>

</div>





</body>
</html>
