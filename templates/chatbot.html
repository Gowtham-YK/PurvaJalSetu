<style id="purvajalsetu-mobile-responsive">
/* =========================================================
   MOBILE / PHONE RESPONSIVE SUPPORT
   Added without changing existing desktop styling.
========================================================= */
@media (max-width: 768px) {
    html, body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden !important;
    }

    *, *::before, *::after {
        max-width: 100%;
    }

    img, video, iframe, canvas, svg {
        max-width: 100%;
    }

    /* Main dashboard/app layouts */
    .dashboard,
    .app-shell {
        display: block !important;
        width: 100% !important;
        min-width: 0 !important;
    }

    .sidebar {
        position: relative !important;
        left: auto !important;
        top: auto !important;
        right: auto !important;
        bottom: auto !important;
        width: 100% !important;
        min-width: 0 !important;
        min-height: auto !important;
        height: auto !important;
        max-height: none !important;
        padding: 14px 12px !important;
        overflow: visible !important;
    }

    .main-content {
        margin-left: 0 !important;
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
    }

    .mobile-brand {
        display: flex !important;
    }

    /* Navigation */
    .nav-links,
    .side-nav {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px !important;
        width: 100% !important;
    }

    .nav-links a,
    .side-link {
        min-width: 0 !important;
        width: 100% !important;
        min-height: 44px;
        padding: 10px 9px !important;
        justify-content: flex-start;
        white-space: normal !important;
        overflow-wrap: anywhere;
    }

    .menu-title,
    .menu-label {
        padding-left: 5px !important;
        padding-right: 5px !important;
    }

    .brand {
        padding: 3px 6px 16px !important;
        max-width: 100% !important;
    }

    .brand-text,
    .brand-title,
    .brand-subtitle {
        min-width: 0 !important;
        overflow-wrap: anywhere;
    }

    /* Top bars */
    .topbar {
        height: auto !important;
        min-height: 52px !important;
        padding: 9px 12px !important;
        flex-wrap: wrap !important;
        gap: 8px !important;
        justify-content: space-between !important;
    }

    .top-nav {
        width: 100% !important;
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px !important;
    }

    .top-link {
        min-width: 0 !important;
        text-align: center;
        padding: 8px 6px !important;
        overflow-wrap: anywhere;
    }

    /* Main page spacing */
    .content,
    .page-content,
    .main-container,
    .container,
    .content-area,
    .dashboard-content,
    .page-container {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
    }

    .hero {
        margin: 12px 12px 0 !important;
        width: auto !important;
        min-height: 0 !important;
        border-radius: 12px !important;
    }

    .hero-overlay {
        padding: 32px 20px !important;
        max-width: 100% !important;
    }

    .hero h1 {
        font-size: clamp(27px, 8vw, 38px) !important;
        line-height: 1.12 !important;
        overflow-wrap: anywhere;
    }

    .hero p {
        font-size: 14px !important;
        line-height: 1.55 !important;
    }

    /* Cards and grids */
    .grid,
    .cards-grid,
    .card-grid,
    .stats-grid,
    .features-grid,
    .dashboard-grid,
    .form-grid,
    .two-column,
    .three-column {
        grid-template-columns: 1fr !important;
        width: 100% !important;
        min-width: 0 !important;
    }

    .card,
    .panel,
    .section,
    .feature-card,
    .stat-card,
    .dashboard-card {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
    }

    /* Prevent long text from pushing the viewport */
    h1, h2, h3, h4, h5, h6, p, span, label, a, td, th, div {
        overflow-wrap: anywhere;
        word-break: normal;
    }

    /* Forms */
    form {
        max-width: 100% !important;
    }

    input, select, textarea, button {
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    input, select, textarea {
        width: 100%;
    }

    button {
        min-height: 42px;
    }

    /* Tables remain usable by horizontal scrolling instead of breaking layout */
    .table-container,
    .table-wrapper,
    .table-responsive,
    .orders-table-container,
    .data-table-container {
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
    }

    table {
        max-width: none !important;
    }

    /* Maps */
    #map,
    #stpMap,
    #trackingMap,
    #routeMap,
    .map,
    .leaflet-container {
        width: 100% !important;
        max-width: 100% !important;
    }

    /* Images */
    .brand-icon img,
    .brand img,
    img {
        object-fit: contain;
    }

    /* Modals / dialogs */
    .modal,
    .modal-content,
    .dialog,
    .popup,
    .modal-box {
        max-width: calc(100vw - 24px) !important;
        width: auto !important;
    }

    /* Action/button rows */
    .actions,
    .button-row,
    .action-buttons,
    .tanker-request-actions,
    .pickup-actions {
        width: 100% !important;
        min-width: 0 !important;
        flex-wrap: wrap !important;
    }

    .actions > *,
    .button-row > *,
    .action-buttons > *,
    .tanker-request-actions > *,
    .pickup-actions > * {
        min-width: 0 !important;
        max-width: 100% !important;
    }

    /* Chatbot */
    #ww-chatbot-toggle {
        right: 14px !important;
        bottom: 14px !important;
        width: 58px !important;
        height: 58px !important;
    }

    #ww-chatbot-window {
        left: 10px !important;
        right: 10px !important;
        bottom: 82px !important;
        width: auto !important;
        max-width: none !important;
        height: min(70vh, 560px) !important;
    }

    #ww-chatbot-header,
    #ww-chatbot-input-area,
    #ww-chatbot-messages {
        max-width: 100% !important;
    }

    /* Prevent fixed/sticky desktop elements from overflowing */
    .fixed,
    .sticky {
        max-width: 100vw !important;
    }
}

@media (max-width: 480px) {
    .sidebar {
        padding: 12px 10px !important;
    }

    .nav-links,
    .side-nav {
        gap: 6px !important;
    }

    .nav-links a,
    .side-link {
        font-size: 12px !important;
        padding: 9px 8px !important;
        min-height: 42px;
    }

    .hero {
        margin-left: 10px !important;
        margin-right: 10px !important;
    }

    .hero-overlay {
        padding: 28px 16px !important;
    }

    .hero-btn,
    .hero a,
    .cta,
    .primary-btn,
    .secondary-btn {
        max-width: 100% !important;
        white-space: normal !important;
    }

    .top-nav {
        grid-template-columns: 1fr 1fr !important;
    }

    #ww-chatbot-window {
        left: 8px !important;
        right: 8px !important;
        bottom: 78px !important;
        height: 68vh !important;
    }
}
</style>
<!-- =========================================================
     WASTEWATER AI CHATBOT
     Reusable component for Site User / Seller / Tanker
========================================================= -->

<div id="ww-chatbot">

    <!-- Floating button -->
    <button
        id="ww-chatbot-toggle"
        type="button"
        aria-label="Open Juno AI"    >
       <img src="{{ url_for('static', filename='images/juno-ai.png') }}" alt="Juno AI">
    </button>


    <!-- Chat window -->
    <div
        id="ww-chatbot-window"
        class="ww-chatbot-hidden"
    >

        <!-- Header -->
        <div id="ww-chatbot-header">

            <div class="ww-chatbot-title">

                <div class="ww-chatbot-avatar">
                <img src="{{ url_for('static', filename='images/juno-ai.png') }}" alt="Juno AI">
                </div>

                <div>
                <strong>Juno AI</strong>                    
                <span>AI-powered support</span>
                </div>

            </div>

            <button
                id="ww-chatbot-close"
                type="button"
                aria-label="Close chatbot"
            >
                ×
            </button>

        </div>


                <!-- Messages -->
        <div id="ww-chatbot-messages">

            <div class="ww-chat-message ww-chat-bot">

                <div class="ww-chat-bubble">
                    Hello! 👋
                    I'm Juno, your JalSetu AI assistant.
                    I can help you with STPs, orders,
                    routing, demand and tanker information.
                </div>

            </div>

        </div>


        <!-- Typing indicator -->
        <div
            id="ww-chatbot-typing"
            class="ww-chatbot-typing-hidden"
        >
        Juno is typing...        
    </div>


        <!-- Input -->
        <div id="ww-chatbot-input-area">

            <input
                type="text"
                id="ww-chatbot-input"
                placeholder="Ask something..."
                autocomplete="off"
            >

            <button
                id="ww-chatbot-send"
                type="button"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </div>

</div>
